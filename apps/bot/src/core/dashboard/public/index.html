<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kini Bot Admin Portal - Đăng Nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="logo-area">
        <span class="logo-icon">🃏</span>
        <h1>KINI BOT</h1>
        <p>Hệ Thống Quản Trị Casino & Game PvP</p>
      </div>
      
      <form id="loginForm" class="login-form">
        <div class="input-group">
          <label for="password">Mật Khẩu Quản Trị</label>
          <input type="password" id="password" placeholder="Nhập mã bảo mật để tiếp tục..." required autocomplete="current-password">
        </div>
        
        <div id="errorMessage" class="error-message hidden">
          Mật khẩu không chính xác. Vui lòng thử lại!
        </div>
        
        <button type="submit" id="btnSubmit">
          <span>ĐĂNG NHẬP</span>
          <span class="btn-loader hidden"></span>
        </button>
      </form>
    </div>
  </div>
  
  <script>
    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('errorMessage');
    const btnSubmit = document.getElementById('btnSubmit');

    // Check if already authenticated
    fetch('/api/auth/status')
      .then(res => res.json())
      .then(data => {
        if (data.authenticated) {
          window.location.href = '/dashboard.html';
        }
      });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.classList.add('hidden');
      btnSubmit.classList.add('loading');
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password: passwordInput.value })
        });
        
        if (response.ok) {
          window.location.href = '/dashboard.html';
        } else {
          const data = await response.json();
          errorMessage.textContent = data.error || 'Đăng nhập thất bại';
          errorMessage.classList.remove('hidden');
          btnSubmit.classList.remove('loading');
        }
      } catch (err) {
        errorMessage.textContent = 'Lỗi kết nối máy chủ. Vui lòng kiểm tra lại!';
        errorMessage.classList.remove('hidden');
        btnSubmit.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
